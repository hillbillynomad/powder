<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powder - Snowfall Forecast</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>Powder</h1>
            <form id="search-form" class="search" role="search" autocomplete="off">
                <input id="search-input" class="search-input" type="text" inputmode="search"
                       enterkeyhint="search" placeholder="Search resorts"
                       aria-label="Search resorts" aria-controls="search-results">
                <button id="search-clear" class="search-clear" type="button"
                        title="Clear search" aria-label="Clear search" hidden>&times;</button>
                <div id="search-results" class="search-results" hidden></div>
            </form>
            <div id="map-menu" class="map-menu header-actions">
                <div class="map-menu-buttons">
                    <button id="menu-toggle" class="map-menu-button" type="button" title="Menu"
                            aria-label="Menu" aria-expanded="false" aria-controls="menu-panel">
                        <span aria-hidden="true">&#9776;</span>
                    </button>
                    <button id="share-button" class="map-menu-button" type="button"
                            title="Copy a link to this view" aria-label="Copy a link to this view">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                            <path fill="currentColor" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/>
                        </svg>
                    </button>
                </div>

                <div id="menu-panel" class="menu-panel" role="dialog" aria-label="Menu">
                    <section class="menu-section">
                        <h2>Filters</h2>
                        <div class="filter-group">
                            <label for="snow-filter">Snowfall</label>
                            <select id="snow-filter" class="snow-filter">
                                <option value="forecast">Powder on the Way</option>
                                <option value="historical">Recent Powder</option>
                                <option value="total">Total Recent + Forecast</option>
                            </select>
                        </div>
                        <div class="legend">
                            <span class="legend-item"><span class="bubble small"></span> 1-5"</span>
                            <span class="legend-item"><span class="bubble medium"></span> 6-12"</span>
                            <span class="legend-item"><span class="bubble large"></span> 13"+</span>
                        </div>
                    </section>

                    <section class="menu-section">
                        <h2>Base map</h2>
                        <label class="menu-check"><input type="radio" name="base-mode" value="sat"> Satellite</label>
                        <label class="menu-check"><input type="radio" name="base-mode" value="map"> Map</label>
                        <label class="menu-check"><input type="radio" name="base-mode" value="topo"> Topo</label>
                    </section>

                    <section class="menu-section">
                        <h2>Overlays</h2>
                        <label class="menu-check"><input type="checkbox" data-pref="labels"> Labels (satellite)</label>
                        <label class="menu-check"><input type="checkbox" data-pref="terrain"> Terrain contours</label>
                        <label class="menu-check"><input type="checkbox" data-pref="threeD"> 3D relief</label>
                        <label class="menu-check"><input type="checkbox" data-pref="trails"> Lifts &amp; trails</label>
                    </section>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="content-wrapper">
            <aside id="side-panel" class="side-panel" data-snap="peek">
                <div class="panel-header">
                    <button id="panel-collapse" class="panel-collapse" title="Collapse panel" aria-label="Collapse panel" aria-expanded="true">◀</button>
                    <div class="panel-tabs">
                        <button class="panel-tab active" data-tab="top10">Top 10</button>
                        <button class="panel-tab" data-tab="details">Details</button>
                    </div>
                </div>
                <div class="panel-content">
                    <div id="top10-content" class="tab-content">
                        <div id="top-resorts-list" class="top-resorts-list"></div>
                    </div>
                    <div id="details-content" class="tab-content hidden">
                        <div id="detail-content"></div>
                    </div>
                </div>
            </aside>

            <div class="map-wrapper">
                <div id="map"></div>

                <div id="toast" class="toast" role="status" aria-live="polite"></div>
                <button id="panel-reopen" class="panel-reopen" title="Show panel" aria-label="Show panel" aria-expanded="false" hidden><span class="chev">▶</span></button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/maplibre-contour@0.1.1/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.1/dist/apexcharts.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
