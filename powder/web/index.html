<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powder - Snowfall Forecast</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="img/snowflake.svg">
    <!-- Link preview: just the snowflake. A still image, not a GIF: iMessage plays an animated preview instead of opening the link (absolute URLs: scrapers don't resolve relative ones) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hillbillynomad.github.io/powder/">
    <!-- Blank (U+2800, which scrapers do not trim): an empty title falls back to <title> -->
    <meta property="og:title" content="&#x2800;">
    <meta property="og:image" content="https://hillbillynomad.github.io/powder/img/share-card.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="A glowing snowflake in falling snow">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://hillbillynomad.github.io/powder/img/share-card.png">
</head>
<body>
    <!-- Snowflake geometry shared by every layer of the 3D logo -->
    <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
        <defs>
            <linearGradient id="flake-ice" x1="-45" y1="-50" x2="45" y2="50" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#ffffff"/>
                <stop offset="0.4" stop-color="#e3f3ff"/>
                <stop offset="0.68" stop-color="#9ccfff"/>
                <stop offset="1" stop-color="#f2faff"/>
            </linearGradient>
            <path id="flake-arm" fill="none" d="M0 -10 V -44 M0 -19 L -10 -29 M0 -19 L 10 -29 M0 -31 L -7 -38 M0 -31 L 7 -38"/>
            <symbol id="flake-shape" viewBox="-50 -50 100 100">
                <g stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
                    <use href="#flake-arm"/>
                    <use href="#flake-arm" transform="rotate(60)"/>
                    <use href="#flake-arm" transform="rotate(120)"/>
                    <use href="#flake-arm" transform="rotate(180)"/>
                    <use href="#flake-arm" transform="rotate(240)"/>
                    <use href="#flake-arm" transform="rotate(300)"/>
                    <polygon points="0,-11 9.5,-5.5 9.5,5.5 0,11 -9.5,5.5 -9.5,-5.5"/>
                </g>
            </symbol>
            <!-- Bright ice core drawn on the two outer faces only -->
            <symbol id="flake-core" viewBox="-50 -50 100 100">
                <g fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
                    <path d="M0 -12 V -42"/>
                    <path d="M0 -12 V -42" transform="rotate(60)"/>
                    <path d="M0 -12 V -42" transform="rotate(120)"/>
                    <path d="M0 -12 V -42" transform="rotate(180)"/>
                    <path d="M0 -12 V -42" transform="rotate(240)"/>
                    <path d="M0 -12 V -42" transform="rotate(300)"/>
                    <polygon points="0,-6 5.2,-3 5.2,3 0,6 -5.2,3 -5.2,-3"/>
                </g>
            </symbol>
        </defs>
    </svg>

    <header class="header">
        <div class="header-content">
            <button id="home-button" class="home-button" type="button" title="Back to the globe" aria-label="Powder: back to the globe">
                <span class="flake-stage" aria-hidden="true">
                    <span class="flake">
                        <svg class="flake-layer face" viewBox="0 0 100 100" style="--z:-3"><use href="#flake-shape"/><use href="#flake-core"/></svg>
                        <svg class="flake-layer" viewBox="0 0 100 100" style="--z:-2"><use href="#flake-shape"/></svg>
                        <svg class="flake-layer" viewBox="0 0 100 100" style="--z:-1"><use href="#flake-shape"/></svg>
                        <svg class="flake-layer" viewBox="0 0 100 100" style="--z:0"><use href="#flake-shape"/></svg>
                        <svg class="flake-layer" viewBox="0 0 100 100" style="--z:1"><use href="#flake-shape"/></svg>
                        <svg class="flake-layer" viewBox="0 0 100 100" style="--z:2"><use href="#flake-shape"/></svg>
                        <svg class="flake-layer face" viewBox="0 0 100 100" style="--z:3"><use href="#flake-shape"/><use href="#flake-core"/></svg>
                    </span>
                    <span class="sparkle sp1"></span>
                    <span class="sparkle sp2"></span>
                    <span class="sparkle sp3"></span>
                    <span class="sparkle sp4"></span>
                </span>
            </button>
            <form id="search-form" class="search" role="search" autocomplete="off">
                <input id="search-input" class="search-input" type="text" inputmode="search"
                       enterkeyhint="search" placeholder="Search resorts"
                       aria-label="Search resorts" aria-controls="resort-list">
                <button id="search-clear" class="search-clear" type="button"
                        title="Clear search" aria-label="Clear search" hidden>&times;</button>
            </form>
            <div id="map-menu" class="map-menu header-actions">
                <div class="map-menu-buttons">
                    <button id="menu-toggle" class="map-menu-button" type="button" title="Menu"
                            aria-label="Menu" aria-expanded="false" aria-controls="menu-panel">
                        <span aria-hidden="true">&#9776;</span>
                    </button>
                    <button id="share-button" class="map-menu-button" type="button"
                            title="Copy a link to this view" aria-label="Copy a link to this view">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                            <path fill="currentColor" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/>
                        </svg>
                    </button>
                </div>

                <div id="menu-panel" class="menu-panel" role="dialog" aria-label="Menu">
                    <section class="menu-section">
                        <h2>Filters</h2>
                        <div class="filter-group">
                            <label for="snow-filter">Snowfall</label>
                            <select id="snow-filter" class="snow-filter">
                                <option value="forecast">Powder on the Way</option>
                                <option value="historical">Recent Powder</option>
                                <option value="total">Total Recent + Forecast</option>
                            </select>
                        </div>
                        <div class="legend">
                            <span class="legend-item"><span class="bubble small"></span> 1-5"</span>
                            <span class="legend-item"><span class="bubble medium"></span> 6-12"</span>
                            <span class="legend-item"><span class="bubble large"></span> 13"+</span>
                        </div>
                    </section>

                    <section class="menu-section">
                        <h2>Base map</h2>
                        <label class="menu-check"><input type="radio" name="base-mode" value="sat"> Satellite</label>
                        <label class="menu-check"><input type="radio" name="base-mode" value="map"> Map</label>
                        <label class="menu-check"><input type="radio" name="base-mode" value="topo"> Topo</label>
                    </section>

                    <section class="menu-section">
                        <h2>Overlays</h2>
                        <label class="menu-check"><input type="checkbox" data-pref="labels"> Labels (satellite)</label>
                        <label class="menu-check"><input type="checkbox" data-pref="terrain"> Terrain contours</label>
                        <label class="menu-check"><input type="checkbox" data-pref="threeD"> 3D relief</label>
                        <label class="menu-check"><input type="checkbox" data-pref="trails"> Lifts &amp; resort names</label>
                    </section>

                    <section class="menu-section">
                        <h2>Weather</h2>
                        <label class="menu-check"><input type="radio" name="wx-overlay" value="none" checked> None</label>
                        <label class="menu-check"><input type="radio" name="wx-overlay" value="temp" disabled> Temperature</label>
                        <label class="menu-check"><input type="radio" name="wx-overlay" value="depth" disabled> Snow depth</label>
                        <label class="menu-check"><input type="radio" name="wx-overlay" value="fresh" disabled> New snow (24h)</label>
                        <p id="wx-status" class="menu-note">Loading weather data…</p>
                    </section>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="content-wrapper">
            <aside id="side-panel" class="side-panel" data-snap="peek">
                <div class="panel-header">
                    <button id="panel-collapse" class="panel-collapse" title="Collapse panel" aria-label="Collapse panel" aria-expanded="true">◀</button>
                    <div class="panel-modes" role="tablist" aria-label="Resort list">
                        <button class="panel-mode active" type="button" role="tab" aria-selected="true" data-mode="view" title="Resorts visible on the map">
                            In view <span id="view-count" class="mode-count"></span>
                        </button>
                        <button class="panel-mode" type="button" role="tab" aria-selected="false" data-mode="top10" title="Most snow worldwide">Top 10</button>
                        <button class="panel-mode" type="button" role="tab" aria-selected="false" data-mode="search" hidden>
                            Search <span id="search-count" class="mode-count"></span>
                        </button>
                    </div>
                </div>
                <div class="panel-content">
                    <div id="list-content" class="tab-content">
                        <div id="list-summary" class="list-summary"></div>
                        <div id="resort-list" class="resort-list"></div>
                    </div>
                    <div id="details-content" class="tab-content hidden">
                        <button id="detail-back" class="detail-back" type="button">
                            <span aria-hidden="true">&larr;</span> <span id="detail-back-label">In view</span>
                        </button>
                        <div id="detail-content"></div>
                    </div>
                </div>
            </aside>

            <div class="map-wrapper">
                <div id="map"></div>

                <div id="toast" class="toast" role="status" aria-live="polite"></div>
                <div id="flyby-bar" class="flyby-bar" hidden>
                    <button id="flyby-restart" class="flyby-btn" type="button" aria-label="Back to the start">⏮</button>
                    <button id="flyby-toggle" class="flyby-btn flyby-play" type="button" aria-label="Pause flyover">❚❚</button>
                    <input id="flyby-slider" class="flyby-slider" type="range" min="0" max="0" step="1" value="0"
                           aria-label="Flyover position">
                    <span id="flyby-time" class="flyby-time">0:00 / 0:00</span>
                    <button id="flyby-end" class="flyby-btn" type="button" aria-label="Jump to the end">⏭</button>
                </div>
                <div id="wx-timebar" class="wx-timebar" hidden>
                    <button id="wx-play" class="wx-play" type="button" aria-label="Play">▶</button>
                    <div class="wx-track">
                        <input id="wx-slider" class="wx-slider" type="range" min="0" max="0" step="1" value="0"
                               aria-label="Forecast time">
                        <div id="wx-legend" class="wx-legend"></div>
                    </div>
                    <div class="wx-time">
                        <span id="wx-time-when" class="wx-time-when"></span>
                        <span id="wx-time-rel" class="wx-time-rel"></span>
                    </div>
                    <button id="wx-now" class="wx-now" type="button" hidden>Now</button>
                </div>
                <button id="panel-reopen" class="panel-reopen" title="Show panel" aria-label="Show panel" aria-expanded="false" hidden><span class="chev">▶</span></button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/maplibre-contour@0.1.1/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.1/dist/apexcharts.min.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/flyby.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
