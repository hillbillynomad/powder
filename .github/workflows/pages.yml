name: Deploy Forecasts

on:
  # Every 6 hours, ~5.5h after each GFS cycle (00/06/12/18Z) so the newest model run is
  # fully published for the weather overlays
  schedule:
    - cron: '30 5,11,17,23 * * *'
  # Run on push to main
  push:
    branches: ["main"]
  # Allow manual trigger
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          pip install poetry
          poetry --version

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Generate forecast data
        run: poetry run powder --export-json --no-cache

      - name: Validate forecast data
        run: python scripts/validate_export.py

      - name: Generate weather overlays
        # Optional layer (GFS temperature / snow frames): if NOAA's bucket is unreachable the
        # site still deploys and the UI just shows the Weather menu as unavailable
        continue-on-error: true
        run: poetry run powder --export-overlays

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: 'powder/web'
      - id: deployment
        uses: actions/deploy-pages@v5
